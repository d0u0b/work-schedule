<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dff0fc">
<meta name="description" content="洪國昌的上班班表：大字、好按，看今天上什麼班、每月可以修改。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="班表">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>洪國昌班表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: brand + toolbar -> today card -> install card -> month box -> sticky name header -> one row per day; floating "back to top" and "done, lock" bottom-right.
   Single pastel sky theme (translucent white cards over a soft sky gradient). Spacing only from the 4-step scale. */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --bg:#eaf5fd; --bgTop:#dff0fc; --bgBottom:#f8fbff;
  --glass:rgba(255,255,255,.74); --glassStrong:rgba(255,255,255,.92); --headBg:rgba(234,245,253,.9);
  --ink:#2b4258; --muted:#5f7489; --faint:#a3b7c9; --line:rgba(98,155,205,.28);
  --accent:#3d8cce; --accent-ink:#ffffff; --accentSoft:rgba(125,189,236,.24); --meBg:rgba(150,205,245,.38); --meLine:#8ec2ea;
  --sun:#d46c64; --sat:#4c9670; --today:rgba(255,236,222,.66); --todayLine:#f2c7a8;
  --edit:#ffe8de; --editInk:#c2674a;
  --sA:#cfe5fb; --sA-ink:#255f96;
  --sB:#f9d8e3; --sB-ink:#a0405f;
  --sC:#cdeee6; --sC-ink:#1f7062;
  --sD:#e3dafa; --sD-ink:#57439e;
  --shadow:0 8px 24px rgba(61,140,206,.12);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:18px; --cellH:56px; --cellF:26px; --dtF:22px; --nmF:clamp(12px,3.7vw,16px);
  color-scheme:light;
}
:root.bigtext{--fs:21px; --cellH:68px; --cellF:32px; --dtF:26px}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) linear-gradient(180deg,var(--bgTop) 0%,var(--bg) 35%,var(--bgBottom) 100%) no-repeat;background-attachment:fixed;min-height:100%;
  color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.5;
  padding-left:max(var(--s3),env(safe-area-inset-left,0px));padding-right:max(var(--s3),env(safe-area-inset-right,0px));padding-block:var(--s2) 160px}
@media (min-width:380px){body{padding-left:max(var(--s4),env(safe-area-inset-left,0px));padding-right:max(var(--s4),env(safe-area-inset-right,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bgTop)}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s4)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{width:1.1em;height:1.1em;flex:none;display:inline-block;vertical-align:-.15em}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:var(--shadow)}

/* 標題 */
.brand{display:flex;align-items:center;gap:var(--s3);padding-top:var(--s2)}
.brand svg{width:44px;height:44px;flex:none;filter:drop-shadow(0 4px 8px rgba(61,140,206,.25))}
.brand h1{margin:0;font-size:1.3em;font-weight:900;letter-spacing:.02em}

/* 工具列 */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tool{min-height:56px;border-radius:var(--s4);font-size:16px;font-weight:700;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:var(--s1);padding:0 var(--s2)}
.tool .ic{width:20px;height:20px}
.tool.lock.editing{background:var(--edit);border-color:var(--editInk);color:var(--editInk)}
@media (max-width:340px){.tool .ic{display:none}}

/* 今天 */
.todaycard{background:var(--today);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:2px solid var(--todayLine);border-radius:var(--s5);
  padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3);box-shadow:0 8px 24px rgba(232,160,120,.14)}
.todaycard .lbl{font-weight:700;color:var(--muted);display:flex;align-items:center;gap:var(--s2)}
.todaycard .lbl .ic{color:#e8956a;width:1.3em;height:1.3em}
.todaycard .lbl b{color:var(--ink);font-size:1.2em}
.todayshift{display:flex;flex-wrap:wrap;gap:var(--s2)}
.ts{display:flex;align-items:center;gap:var(--s3);background:var(--glassStrong);border-radius:var(--s4);padding:var(--s2) var(--s4) var(--s2) var(--s2);font-size:1.05em;font-weight:700}
.ts .chip{min-width:2.9em;height:2.7em;font-size:1.1em}
.ts .tm{display:block;font-size:.78em;color:var(--muted);font-variant-numeric:tabular-nums}
.ts.off{color:var(--muted);padding-left:var(--s4)}
.ts.off .ic{width:1.3em;height:1.3em;color:#8a9fd6}
.tomorrow{border-top:1px dashed var(--todayLine);padding-top:var(--s3);display:flex;align-items:flex-start;gap:var(--s2)}
.tomorrow .ic{margin-top:.25em;color:var(--muted)}
.tomorrow b{font-weight:900}

.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--s3);font-weight:900}
.s-A{background:var(--sA);color:var(--sA-ink)} .s-B{background:var(--sB);color:var(--sB-ink)}
.s-C{background:var(--sC);color:var(--sC-ink)} .s-D{background:var(--sD);color:var(--sD-ink)}

/* 放到桌面 */
.installcard{border-radius:var(--s5);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.installcard .msg{display:flex;gap:var(--s3);align-items:flex-start;margin:0}
.installcard .msg .ic{width:2em;height:2em;color:var(--accent);flex:none}
.installcard .row2 .big{min-height:52px}

/* 月份 */
.monthbox{border-radius:var(--s5);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:var(--s2)}
.nav{height:56px;border-radius:var(--s4);border:1px solid var(--line);background:var(--accentSoft);display:flex;align-items:center;justify-content:center;padding:0;color:var(--accent)}
.nav .ic{width:28px;height:28px;stroke-width:2.6}
.month{text-align:center;line-height:1.15}
.month b{display:flex;align-items:center;justify-content:center;gap:var(--s2);font-size:1.65em;font-weight:900}
.month b .ic{width:.8em;height:.8em;color:var(--accent)}
.month .yr{display:block;font-size:.9em;color:var(--muted)}
.total{min-height:56px;border-radius:var(--s4);border:0;background:var(--accentSoft);font-size:1.05em;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:var(--s2) var(--s3);text-align:center}
.total .t1{display:flex;align-items:center;justify-content:center;gap:var(--s2)}
.total .t1 .ic{color:var(--accent);width:1.3em;height:1.3em}
.total b{font-size:1.35em;font-weight:900;font-variant-numeric:tabular-nums}
.total .more{font-size:.85em;color:var(--accent);display:inline-flex;align-items:center}
.backnow{min-height:52px;border-radius:var(--s4);border:2px solid var(--accent);background:var(--glassStrong);color:var(--accent);font-size:1em;font-weight:700;padding:0 var(--s4);display:flex;align-items:center;justify-content:center;gap:var(--s2)}

/* 班別時間 */
.legend{border-radius:var(--s5);padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3);text-align:left;width:100%;font-size:1em}
.legend-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-weight:700}
.legend-h > span{display:flex;align-items:center;gap:var(--s2)}
.legend-h .ic{color:var(--accent);width:1.2em;height:1.2em}
.legend-h .more{font-size:.85em;color:var(--accent);display:inline-flex;align-items:center}
.legend-h .more .ic{width:1em;height:1em}
.legend-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2) var(--s3)}
.lg-i{display:flex;align-items:center;gap:var(--s2);min-width:0}
.lg-i .chip{min-width:40px;height:40px;font-size:20px;flex:none}
.lg-i span{font-variant-numeric:tabular-nums;font-weight:700;font-size:.92em;line-height:1.25;min-width:0}
.lg-i small{display:block;font-size:.8em;color:var(--muted);font-weight:500}
.lg-i .unset{color:var(--faint);font-weight:500}
.tblock{display:flex;flex-direction:column;gap:var(--s2);background:var(--accentSoft);border-radius:var(--s4);padding:var(--s3)}
.th{display:flex;align-items:center;gap:var(--s2);font-weight:700}
.th .chip{min-width:40px;height:40px;font-size:20px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:var(--s2)}
.trow label{display:flex;flex-direction:column;gap:var(--s1);font-size:.85em;color:var(--muted);font-weight:700;min-width:0}
.trow .to{padding-bottom:var(--s3)}
.trow .to{color:var(--muted);font-weight:700}
.sheet .trow input{height:56px;font-size:19px;padding:0 var(--s2);font-variant-numeric:tabular-nums;color:var(--ink)}
.sheet .note{margin:calc(var(--s2) * -1) 0 0;color:var(--muted);line-height:1.6}

/* 名字列（黏在上面） */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--headBg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  padding-block:var(--s2);display:flex;flex-direction:column;gap:var(--s2);margin-inline:calc(var(--s2) * -1);padding-inline:var(--s2);border-radius:0 0 var(--s4) var(--s4)}
.editbar{background:var(--edit);color:var(--editInk);border-radius:var(--s3);font-weight:700;padding:var(--s2);font-size:.95em;display:flex;align-items:center;justify-content:center;gap:var(--s2);text-align:center}
.grid{display:grid;grid-template-columns:44px repeat(6,minmax(0,1fr));gap:var(--s1)}
@media (min-width:420px){.grid{grid-template-columns:52px repeat(6,minmax(0,1fr))}}
.ph{grid-column:span 3;text-align:center;font-size:14px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--line);padding-bottom:var(--s1)}
.nm{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;border:1px solid var(--line);border-radius:var(--s3);background:var(--glassStrong);
  font-size:var(--nmF);font-weight:700;padding:0;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.nm.me{background:var(--meBg);border-color:var(--meLine)}

.empty{border-radius:var(--s5);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);border-style:dashed}
.empty p{margin:0;display:flex;gap:var(--s2);align-items:flex-start}
.empty p .ic{width:1.4em;height:1.4em;color:var(--accent);margin-top:.1em}
.big{min-height:56px;border-radius:var(--s4);border:0;background:var(--accent);color:var(--accent-ink);font-size:1.08em;font-weight:700;padding:0 var(--s4);
  display:flex;align-items:center;justify-content:center;gap:var(--s2)}
.big .ic{width:1.2em;height:1.2em}
.big.ghost{background:var(--glassStrong);color:var(--ink);border:1px solid var(--line)}
.big.soft{background:var(--accentSoft);color:var(--ink)}

/* 每天一行 */
.days{display:flex;flex-direction:column;gap:var(--s1)}
.day{padding-block:var(--s1);border-radius:var(--s3)}
.day.wkstart{margin-top:var(--s3)}
.day.wkstart:first-child{margin-top:0}
.dt{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.dt b{font-size:var(--dtF);font-weight:900;font-variant-numeric:tabular-nums}
.dt small{font-size:15px;font-weight:700;color:var(--muted)}
.day.sun .dt b,.day.sun .dt small{color:var(--sun)}
.day.sat .dt b,.day.sat .dt small{color:var(--sat)}
.cell{height:var(--cellH);border-radius:var(--s3);border:1px solid var(--line);background:var(--glass);font-size:var(--cellF);font-weight:900;padding:0}
.cell.s-A,.cell.s-B,.cell.s-C,.cell.s-D{border-color:transparent}
.cell.off{color:var(--faint);font-size:15px;font-weight:500}
.editing-on .cell{border:1.5px dashed var(--editInk)}
.day.today{background:var(--today);outline:3px solid var(--todayLine);outline-offset:2px}

.foot{font-size:.9em;color:var(--muted);text-align:center;margin:var(--s2) 0 0}

/* 右下角浮動按鈕 */
.fabs{position:fixed;z-index:15;right:max(var(--s4),calc(env(safe-area-inset-right,0px) + var(--s4)));bottom:calc(env(safe-area-inset-bottom,0px) + var(--s4));
  display:flex;flex-direction:column;align-items:flex-end;gap:var(--s3);pointer-events:none}
.fab{pointer-events:auto;min-height:60px;border-radius:999px;font-size:17px;font-weight:700;padding:0 var(--s5) 0 var(--s4);display:flex;align-items:center;gap:var(--s2)}
.fab .ic{width:24px;height:24px}
.fab.top{background:var(--glassStrong);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--accent);box-shadow:0 8px 24px rgba(61,140,206,.25)}
.fab.lock{border:0;background:var(--editInk);color:#fff;min-height:64px;font-size:18px;box-shadow:0 8px 24px rgba(194,103,74,.35)}

/* 底部選單 */
.shade{position:fixed;inset:0;background:rgba(43,66,88,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--glassStrong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:var(--s5) var(--s5) 0 0;
  padding:var(--s4) max(var(--s4),env(safe-area-inset-right,0px)) calc(var(--s4) + env(safe-area-inset-bottom,0px)) max(var(--s4),env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:var(--s4);max-width:600px;margin:0 auto;box-shadow:0 -8px 32px rgba(43,66,88,.18);max-height:88vh;overflow-y:auto}
.sheet h2{margin:0;font-size:1.45em;font-weight:900;display:flex;align-items:center;gap:var(--s2)}
.sheet h2 .ic{color:var(--accent)}
.sheet .who{margin:calc(var(--s2) * -1) 0 0;color:var(--muted)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.closex{min-height:48px;border-radius:var(--s3);border:1px solid var(--line);background:var(--glassStrong);font-size:1em;font-weight:700;padding:0 var(--s4);display:flex;align-items:center;gap:var(--s1)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.pick button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;height:76px;border-radius:var(--s4);border:3px solid transparent;font-size:30px;font-weight:900;position:relative;padding:0}
.pick button small{font-size:14px;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.pick button.cur{border-color:var(--ink)}
.pick button.cur::after{content:"目前";position:absolute;top:var(--s1);right:var(--s3);font-size:14px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.sheet input{height:56px;border-radius:var(--s3);border:2px solid var(--line);background:#fff;color:var(--ink);font-size:22px;padding:0 var(--s4);font-family:inherit;width:100%}
.place-sum{display:flex;flex-direction:column;gap:var(--s2);background:var(--accentSoft);border-radius:var(--s4);padding:var(--s3)}
.place-sum h3{margin:0;font-size:1em;color:var(--muted)}
.place-sum .line{display:flex;align-items:center;gap:var(--s3);font-size:1.08em;font-weight:700}
.place-sum .chip{min-width:48px;height:40px;font-size:22px}
.sheet .bigtotal{margin:0;font-size:1.15em}
.sheet .bigtotal b{font-size:1.5em;font-weight:900}

/* 使用說明清單 */
.acc{display:flex;flex-direction:column;gap:var(--s2)}
.acc-item{border:1px solid var(--line);border-radius:var(--s4);overflow:hidden;background:#fff}
.acc-q{width:100%;min-height:60px;border:0;background:transparent;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);font-size:1.02em;font-weight:700;text-align:left}
.acc-q .qi{width:40px;height:40px;border-radius:var(--s3);background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.acc-q .qi .ic{width:22px;height:22px}
.acc-q .qt{flex:1;min-width:0}
.acc-q .chev{width:20px;height:20px;transition:transform .15s;color:var(--muted)}
.acc-q[aria-expanded="true"]{background:var(--accentSoft)}
.acc-q[aria-expanded="true"] .chev{transform:rotate(180deg)}
.acc-a{padding:var(--s3) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.acc-a p{margin:0;line-height:1.7}
.acc-a ol{margin:0;padding-left:var(--s5);display:flex;flex-direction:column;gap:var(--s2);line-height:1.6}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;padding:0 var(--s1);border-radius:var(--s1);background:var(--accentSoft);font-weight:900}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--s4) + env(safe-area-inset-top,0px));z-index:30;
  background:var(--ink);color:#fff;padding:var(--s2) var(--s4);border-radius:999px;font-size:1.02em;font-weight:700;display:flex;align-items:center;gap:var(--s2);white-space:nowrap;max-width:calc(100vw - var(--s5));box-shadow:0 8px 24px rgba(43,66,88,.3)}
.toast.has-undo{padding-right:var(--s2)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{border:0;border-radius:999px;background:#fff;color:var(--ink);font-size:1em;font-weight:700;min-height:44px;padding:0 var(--s4);display:flex;align-items:center;gap:var(--s1);margin-left:var(--s1)}

/* 教學 */
.tourblock{position:fixed;inset:0;z-index:40}
.tourblock.dim{background:rgba(32,52,72,.6)}
.ring{position:fixed;z-index:41;border-radius:var(--s4);pointer-events:none;box-shadow:0 0 0 4px #fff,0 0 0 9999px rgba(32,52,72,.6);transition:all .2s ease}
.tourcard{position:fixed;z-index:42;left:max(var(--s3),env(safe-area-inset-left,0px));right:max(var(--s3),env(safe-area-inset-right,0px));margin:0 auto;max-width:560px;
  background:#fff;border-radius:var(--s5);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);box-shadow:0 8px 32px rgba(0,0,0,.25)}
.tourcard.bottom{bottom:calc(var(--s4) + env(safe-area-inset-bottom,0px))}
.tourcard.top{top:calc(var(--s4) + env(safe-area-inset-top,0px))}
.tourcard .step{font-size:.9em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.tourcard .skip{border:0;background:none;color:var(--muted);font-size:1em;font-weight:700;text-decoration:underline;min-height:44px;padding:0 var(--s1)}
.tourcard h2{margin:0;font-size:1.35em;font-weight:900}
.tourcard p{margin:0;font-size:1.08em;line-height:1.6}

/* 啟動畫面 */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);
  background:linear-gradient(180deg,#d4ebfc 0%,#eaf5fd 60%,#f8fbff 100%);transition:opacity .35s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash svg{width:120px;height:120px;filter:drop-shadow(0 12px 24px rgba(61,140,206,.3))}
.splash b{font-size:28px;font-weight:900;color:var(--ink);letter-spacing:.06em}
.splash .dots{display:flex;gap:var(--s2)}
.splash .dots i{width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:.3}
.splash p{margin:0;color:var(--muted);font-size:18px}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(32px);opacity:.6}}
  .splash svg{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}
  .splash .dots i{animation:dot 1.2s ease-in-out infinite}.splash .dots i:nth-child(2){animation-delay:.2s}.splash .dots i:nth-child(3){animation-delay:.4s}
  @keyframes dot{40%{opacity:1;transform:scale(1.2)}}
  .fab{animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.8);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.ring,.acc-q .chev,.splash{transition:none}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true">
  <svg viewBox="0 0 512 512" data-logo></svg>
  <b>班表</b>
  <div class="dots"><i></i><i></i><i></i></div>
  <p>準備中，請稍等</p>
</div>

<div class="wrap" id="app">
  <header class="brand"><svg viewBox="0 0 512 512" data-logo aria-hidden="true"></svg><h1 id="appTitle">洪國昌的班表</h1></header>

  <div class="tools">
    <button class="tool glass lock" id="lockBtn"></button>
    <button class="tool glass" id="fontBtn"></button>
    <button class="tool glass" id="helpBtn"><i data-icon="help"></i>使用說明</button>
  </div>

  <section class="todaycard" id="todaycard"></section>

  <section class="installcard glass" id="installcard" hidden>
    <p class="msg"><i data-icon="phone"></i><span><b>把班表放到手機桌面</b><br>下次點桌面上的「班表」圖示就能打開。</span></p>
    <div class="row2"><button class="big" id="installBtn"><i data-icon="phone"></i>放到桌面</button><button class="big ghost" id="installLater">以後再說</button></div>
  </section>

  <section class="monthbox glass" id="monthbox">
    <div class="top" id="monthnav">
      <button class="nav" id="prev" aria-label="上個月"><i data-icon="chevL"></i></button>
      <div class="month"><span class="yr" id="ytitle">2026 年</span><b><i data-icon="calendar"></i><span id="mtitle">11 月</span></b></div>
      <button class="nav" id="next" aria-label="下個月"><i data-icon="chevR"></i></button>
    </div>
    <button class="total" id="totalBtn"></button>
    <button class="backnow" id="backnow" hidden><i data-icon="calToday"></i>回到這個月</button>
  </section>

  <section class="empty glass" id="empty" hidden>
    <p><i data-icon="info"></i><span><b>這個月還沒排班。</b>按上面的「開始修改」之後，可以直接點格子排，或先照上個月複製一份再改。</span></p>
    <button class="big" id="copyPrev"><i data-icon="copy"></i>照上個月複製</button>
  </section>

  <button class="legend glass" id="legend"></button>

  <div class="head">
    <div class="editbar" id="editbar" hidden><i data-icon="pen"></i>修改中：點格子就能改</div>
    <div class="grid" id="head"></div>
  </div>

  <div class="days" id="days"></div>
  <p class="foot">改好的內容會自動存在這支手機上。</p>
</div>

<div class="fabs">
  <button class="fab top" id="topBtn" hidden><i data-icon="up"></i>回到最上面</button>
  <button class="fab lock" id="fab" hidden><i data-icon="lock"></i>完成，鎖定</button>
</div>
<div class="shade" id="shade" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"><i data-icon="check"></i><span id="toastText"></span><button id="undoBtn" hidden><i data-icon="undo"></i>復原</button></div>

<div class="tourblock" id="tourblock" hidden></div>
<div class="ring" id="ring" hidden></div>
<div class="tourcard" id="tourcard" hidden role="dialog" aria-modal="true"></div>

<script>
/* ---------- 圖示 ---------- */
const ICONS={
  pen:'<path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M13.5 7l3 3"/>',
  lock:'<rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2"/>',
  help:'<circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17.5h.01"/>',
  textUp:'<path d="M3 19l5-13 5 13M4.8 14.5h6.4"/><path d="M18 8v8M14 12h8"/>',
  textDown:'<path d="M3 19l5-13 5 13M4.8 14.5h6.4"/><path d="M14 12h8"/>',
  sun:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  chevL:'<path d="M15 5l-7 7 7 7"/>', chevR:'<path d="M9 5l7 7-7 7"/>', chevD:'<path d="M6 9l6 6 6-6"/>',
  chart:'<path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="6" width="3" height="11" rx="1"/><rect x="15.5" y="9" width="3" height="8" rx="1"/>',
  calendar:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  calToday:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.8l2 2 4-4"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  copy:'<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/>',
  grid:'<rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 9.5h17M3.5 15h17M9.5 3.5v17"/>',
  phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/>',
  play:'<circle cx="12" cy="12" r="9.5"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/>',
  info:'<circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.5h.01"/>',
  clock:'<circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.2 2"/>',
  arrowUpCircle:'<circle cx="12" cy="12" r="9.5"/><path d="M12 16.5v-9M8 11l4-4 4 4"/>',
};
const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
function paintIcons(root){root.querySelectorAll('i[data-icon]').forEach(el=>{el.outerHTML=ic(el.dataset.icon)})}
const LOGO='<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9e8fc"/><stop offset="1" stop-color="#7dbdec"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)"/><rect x="104" y="136" width="304" height="272" rx="40" fill="#fff"/><path d="M144 136h224a40 40 0 0 1 40 40v32H104v-32a40 40 0 0 1 40-40z" fill="#dff0fc"/><rect x="172" y="100" width="28" height="72" rx="14" fill="#3f86c2"/><rect x="312" y="100" width="28" height="72" rx="14" fill="#3f86c2"/><rect x="140" y="228" width="64" height="64" rx="16" fill="#a9d4f5"/><rect x="224" y="228" width="64" height="64" rx="16" fill="#f5c3d3"/><rect x="308" y="228" width="64" height="64" rx="16" fill="#ffd65c"/><path d="M322 260l14 14 24-26" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="312" width="64" height="64" rx="16" fill="#b4e6d3"/><rect x="224" y="312" width="64" height="64" rx="16" fill="#d3c6f3"/><rect x="308" y="312" width="64" height="64" rx="16" fill="#a9d4f5"/>';
document.querySelectorAll('[data-logo]').forEach((s,i)=>s.innerHTML=LOGO.replace(/\blg\b/g,'lg'+i));
paintIcons(document);

/* ---------- 資料 ---------- */
const WD=['日','一','二','三','四','五','六'];
const SHIFTS=['A','B','C','D'];
const PLACES=[{id:1,label:'第一處',shifts:['A','B']},{id:2,label:'第二處',shifts:['C','D']}];
const KEY='hong-roster-v1', FONT_KEY='hong-roster-font', TOUR_KEY='hong-roster-tour-done', INSTALL_KEY='hong-roster-install-later';
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function seed(){
  const people=[
    {id:'p1',name:'范榮星',place:1},{id:'p2',name:'吳政桓',place:1},{id:'p3',name:'洪國昌',place:1,me:true},
    {id:'p4',name:'林□毅',place:2},{id:'p5',name:'曾百章',place:2},{id:'p6',name:'洪國昌',place:2,me:true},
  ];
  const m={p1:{},p2:{},p3:{},p4:{},p5:{},p6:{}};
  for(let d=1;d<=30;d++){
    const r=d%5;
    if(r!==3) m.p1[d]='A';
    if(r!==1) m.p2[d]='B';
    if(r===1) m.p3[d]='B';
    if(r===3&&d!==3) m.p3[d]='A';
    if(r!==4) m.p4[d]='C';
    if(r!==0) m.p5[d]='D';
    if(r===4) m.p6[d]='C';
    if(r===0) m.p6[d]='D';
  }
  return {people,months:{'2026-11':m}};
}
let state;try{state=JSON.parse(ls.get(KEY))}catch(e){}
if(!state)state=seed();
state.times=state.times||{};
function persist(){ls.set(KEY,JSON.stringify(state))}

/* ---------- 鎖定 / 字體 ---------- */
let editing=false;
function setEditing(v){
  editing=v;
  $('lockBtn').classList.toggle('editing',v);
  $('lockBtn').innerHTML=v?ic('lock')+'完成鎖定':ic('pen')+'開始修改';
  $('fab').hidden=!v;
  $('editbar').hidden=!v;
  document.documentElement.classList.toggle('editing-on',v);
}
function toggleEdit(){setEditing(!editing);toast(editing?'現在可以修改了':'已鎖定並儲存',false)}
$('lockBtn').onclick=toggleEdit;$('fab').onclick=toggleEdit;
let bigText=ls.get(FONT_KEY)==='big';
function setFont(v){
  bigText=v;document.documentElement.classList.toggle('bigtext',v);
  $('fontBtn').innerHTML=v?ic('textDown')+'縮小字體':ic('textUp')+'放大字體';
  ls.set(FONT_KEY,v?'big':'normal');
}
$('fontBtn').onclick=()=>setFont(!bigText);

/* ---------- 回到最上面 ---------- */
function updateTopBtn(){if(typeof tourShown!=='undefined'&&tourShown===$('topBtn'))return;$('topBtn').hidden=scrollY<500}
addEventListener('scroll',updateTopBtn,{passive:true});
$('topBtn').onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});

/* ---------- 日期（網址加 #test-2026-12-05 可以假裝成那一天） ---------- */
function getNow(){
  const m=location.hash.match(/^#test-(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]):new Date();
}
let NOW=getNow();
let Y=NOW.getFullYear(),M=NOW.getMonth()+1;
const key=(y,m)=>y+'-'+String(m).padStart(2,'0');
const hasData=k=>{const mo=state.months[k];return !!mo&&Object.values(mo).some(o=>Object.keys(o).length)};
function shiftOn(pid,y,m,d){const mo=state.months[key(y,m)]||{};return (mo[pid]||{})[d]||''}
const isNowMonth=()=>Y===NOW.getFullYear()&&M===NOW.getMonth()+1;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const people=()=>PLACES.flatMap(pl=>state.people.filter(p=>p.place===pl.id));
const meList=()=>state.people.filter(p=>p.me);
const meName=()=>{const m=meList();return m[0]?m[0].name:''};
const placeOf=p=>PLACES.find(x=>x.id===p.place);
function fmtTime(s){const t=state.times[s];if(!t||!t.start||!t.end)return '';return t.start+'–'+t.end}
const overnight=s=>{const t=state.times[s];return !!(t&&t.start&&t.end&&t.end<=t.start)};

function monthCounts(){
  const days=new Date(Y,M,0).getDate();const cnt={A:0,B:0,C:0,D:0};let total=0;
  for(let d=1;d<=days;d++){let w=false;meList().forEach(p=>{const s=shiftOn(p.id,Y,M,d);if(s){cnt[s]++;w=true}});if(w)total++}
  return {cnt,total};
}

function renderToday(){
  const me=meList();
  const y=NOW.getFullYear(),m=NOW.getMonth()+1,d=NOW.getDate();
  const tm=new Date(y,m-1,d+1);
  const work=me.map(p=>({s:shiftOn(p.id,y,m,d),pl:placeOf(p)})).filter(w=>w.s);
  let h=`<div class="lbl">${ic('sun')}今天 <b>${m}月${d}日　星期${WD[NOW.getDay()]}</b></div><div class="todayshift">`;
  if(work.length)work.forEach(w=>{const t=fmtTime(w.s);h+=`<div class="ts"><span class="chip s-${w.s}">${w.s}</span><span>${w.pl.label} ${w.s} 班${t?`<span class="tm">${t}${overnight(w.s)?'（到隔天）':''}</span>`:''}</span></div>`});
  else h+=`<div class="ts off">${ic('moon')}${esc(meName())} 今天休息</div>`;
  h+='</div>';
  const tw=me.map(p=>({s:shiftOn(p.id,tm.getFullYear(),tm.getMonth()+1,tm.getDate()),pl:placeOf(p)})).filter(w=>w.s);
  h+=`<div class="tomorrow">${ic('arrowR')}<span>明天 ${tm.getMonth()+1}/${tm.getDate()}（${WD[tm.getDay()]}）：<b>${tw.length?tw.map(w=>w.pl.label+' '+w.s+' 班'+(fmtTime(w.s)?`（${fmtTime(w.s)}）`:'')).join('、'):'休息'}</b></span></div>`;
  $('todaycard').innerHTML=h;
}

function render(){
  NOW=getNow();
  renderToday();
  document.title=meName()+'班表';$('appTitle').textContent=meName()+'的班表';
  $('mtitle').textContent=M+' 月';$('ytitle').textContent=Y+' 年';
  $('backnow').hidden=isNowMonth();
  $('empty').hidden=hasData(key(Y,M));
  const {total}=monthCounts();
  $('totalBtn').innerHTML=`<span class="t1">${ic('chart')}<span>${M}月 共上班 <b>${total}</b> 天</span></span><span class="more">看詳細${ic('chevR')}</span>`;
  $('legend').innerHTML=`<div class="legend-h"><span>${ic('clock')}班別時間</span><span class="more">設定${ic('chevR')}</span></div>
    <div class="legend-g">${SHIFTS.map(s=>{const t=fmtTime(s);return `<div class="lg-i"><span class="chip s-${s}">${s}</span>${t?`<span>${t}${overnight(s)?'<small>到隔天</small>':''}</span>`:'<span class="unset">還沒設定</span>'}</div>`}).join('')}</div>`;

  let hh='<div></div>';
  PLACES.forEach(pl=>{hh+=`<div class="ph">${pl.label}</div>`});
  hh+='<div></div>';
  people().forEach(p=>{hh+=`<button class="nm ${p.me?'me':''}" data-rename="${p.id}">${esc(p.name)}</button>`});
  $('head').innerHTML=hh;

  const days=new Date(Y,M,0).getDate();const ps=people();
  const todayD=isNowMonth()?NOW.getDate():0;
  let h='';
  for(let d=1;d<=days;d++){
    const wd=new Date(Y,M-1,d).getDay();
    const cls=['day','grid'];if(wd===0)cls.push('sun','wkstart');if(wd===6)cls.push('sat');if(d===todayD)cls.push('today');
    h+=`<div class="${cls.join(' ')}" data-row="${d}"><div class="dt"><b>${d}</b><small>${WD[wd]}</small></div>`;
    ps.forEach(p=>{
      const s=shiftOn(p.id,Y,M,d);
      h+=`<button class="cell ${s?'s-'+s:'off'}" data-p="${p.id}" data-d="${d}" aria-label="${M}月${d}日 ${esc(p.name)} ${s?s+'班':'休息'}">${s||'休'}</button>`;
    });
    h+='</div>';
  }
  $('days').innerHTML=h;
}

/* ---------- 底部選單 ---------- */
function openSheet(inner,onClick){const sh=$('sheet');sh.innerHTML=inner;sh.hidden=false;$('shade').hidden=false;sh.scrollTop=0;sh.onclick=onClick}
function closeSheet(){$('sheet').hidden=true;$('shade').hidden=true}
$('shade').onclick=closeSheet;

function showTotal(){
  const {cnt,total}=monthCounts();
  let h=`<div class="sheet-head"><h2>${ic('chart')}${M}月 上班天數</h2><button class="closex" data-close>${ic('x')}關閉</button></div>
    <p class="bigtotal">${esc(meName())} 一共上班 <b>${total}</b> 天</p>`;
  PLACES.forEach(pl=>{
    h+=`<div class="place-sum"><h3>${pl.label}</h3>${pl.shifts.map(s=>`<div class="line"><span class="chip s-${s}">${s}</span>${s} 班　${cnt[s]} 天</div>`).join('')}</div>`;
  });
  openSheet(h,e=>{if(e.target.closest('[data-close]'))closeSheet()});
}
$('totalBtn').onclick=showTotal;

let undoData=null;
function remember(){undoData=JSON.stringify(state)}
function commit(msg){persist();render();toast(msg,true)}

function pickShift(pid,d){
  const p=state.people.find(x=>x.id===pid);const pl=placeOf(p);
  const wd=WD[new Date(Y,M-1,d).getDay()];const cur=shiftOn(pid,Y,M,d);
  openSheet(`<h2>${ic('calendar')}${M}月${d}日　星期${wd}</h2><p class="who">${esc(p.name)}・${pl.label}</p>
    <div class="pick">${SHIFTS.map(s=>`<button class="s-${s} ${cur===s?'cur':''}" data-set="${s}">${s} 班${fmtTime(s)?`<small>${fmtTime(s)}</small>`:''}</button>`).join('')}</div>
    <div class="row2"><button class="big ghost" data-set="">${ic('moon')}休息</button><button class="big ghost" data-close>${ic('x')}取消</button></div>`,
  e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-close'))return closeSheet();
    if(b.hasAttribute('data-set')){
      const v=b.getAttribute('data-set');closeSheet();
      if(v===cur)return;
      remember();
      const k=key(Y,M);state.months[k]=state.months[k]||{};const mo=state.months[k];mo[pid]=mo[pid]||{};
      if(v)mo[pid][d]=v;else delete mo[pid][d];
      commit(`${M}/${d} 改成${v?v+' 班':'休息'}`);
    }
  });
}
function rename(pid){
  const p=state.people.find(x=>x.id===pid);
  openSheet(`<h2>${ic('user')}改名字</h2><input id="nm" value="${esc(p.name)}" maxlength="8" autocomplete="off" aria-label="名字">
    <div class="row2"><button class="big" data-ok>${ic('check')}儲存</button><button class="big ghost" data-close>${ic('x')}取消</button></div>`,
  e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-close'))return closeSheet();
    if(b.hasAttribute('data-ok')){
      const v=$('nm').value.trim();closeSheet();
      if(v&&v!==p.name){remember();if(p.me)state.people.forEach(q=>{if(q.me)q.name=v});else p.name=v;commit('名字改好了')}
    }
  });
}
function showTimes(){
  let h=`<div class="sheet-head"><h2>${ic('clock')}班別時間</h2><button class="closex" data-close>${ic('x')}關閉</button></div>
    <p class="note">設定每一種班從幾點到幾點。點時間的格子就能選。不知道的可以先空著。</p>`;
  SHIFTS.forEach(s=>{const t=state.times[s]||{};
    h+=`<div class="tblock"><div class="th"><span class="chip s-${s}">${s}</span>${s} 班</div><div class="trow"><label>開始<input type="time" id="t-${s}-start" value="${t.start||''}"></label><span class="to">到</span><label>結束<input type="time" id="t-${s}-end" value="${t.end||''}"></label></div></div>`});
  h+=`<div class="row2"><button class="big" data-ok>${ic('check')}儲存</button><button class="big ghost" data-close>${ic('x')}取消</button></div>`;
  openSheet(h,e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-close'))return closeSheet();
    if(b.hasAttribute('data-ok')){
      const nt={};SHIFTS.forEach(s=>{const a=$(`t-${s}-start`).value,z=$(`t-${s}-end`).value;if(a||z)nt[s]={start:a,end:z}});
      closeSheet();
      if(JSON.stringify(nt)===JSON.stringify(state.times))return;
      remember();state.times=nt;commit('班別時間已儲存');
    }
  });
}
$('legend').onclick=showTimes;
function needUnlock(){toast('要修改，請先按「開始修改」',false)}

$('days').addEventListener('click',e=>{const c=e.target.closest('[data-p]');if(!c)return;if(!editing)return needUnlock();pickShift(c.dataset.p,+c.dataset.d)});
$('head').addEventListener('click',e=>{const n=e.target.closest('[data-rename]');if(!n)return;if(!editing)return needUnlock();rename(n.dataset.rename)});
$('prev').onclick=()=>{M--;if(M<1){M=12;Y--}render()};
$('next').onclick=()=>{M++;if(M>12){M=1;Y++}render()};
$('backnow').onclick=()=>{Y=NOW.getFullYear();M=NOW.getMonth()+1;render()};
$('copyPrev').onclick=()=>{
  if(!editing)return needUnlock();
  let py=Y,pm=M-1;if(pm<1){pm=12;py--}
  if(!hasData(key(py,pm))){toast('上個月也是空的',false);return}
  remember();
  const src=state.months[key(py,pm)];const days=new Date(Y,M,0).getDate();const out={};
  Object.keys(src).forEach(pid=>{out[pid]={};Object.keys(src[pid]).forEach(d=>{if(+d<=days)out[pid][d]=src[pid][d]})});
  state.months[key(Y,M)]=out;commit('已照上個月複製');
};
$('undoBtn').onclick=()=>{if(!undoData)return;state=JSON.parse(undoData);undoData=null;persist();render();toast('已復原',false)};

let tt;
function toast(t,canUndo){
  const u=!!(canUndo&&undoData);
  $('toastText').textContent=t;$('undoBtn').hidden=!u;$('toast').classList.toggle('has-undo',u);$('toast').hidden=false;
  clearTimeout(tt);tt=setTimeout(()=>{$('toast').hidden=true},u?6000:2200);
}

/* ---------- 放到手機桌面（PWA） ---------- */
let installPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function updateInstallCard(){$('installcard').hidden=isStandalone()||ls.get(INSTALL_KEY)==='1'}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;updateInstallCard()});
addEventListener('appinstalled',()=>{installPrompt=null;ls.set(INSTALL_KEY,'1');updateInstallCard();toast('已放到手機桌面',false)});
async function doInstall(){
  if(installPrompt){
    installPrompt.prompt();
    try{const r=await installPrompt.userChoice;if(r.outcome==='accepted'){ls.set(INSTALL_KEY,'1');updateInstallCard()}}catch(e){}
    installPrompt=null;
  }else showHelp(HELP.findIndex(h=>h.id==='install'));
}
$('installBtn').onclick=doInstall;
$('installLater').onclick=()=>{ls.set(INSTALL_KEY,'1');updateInstallCard();startTour([T.installLater],false)};
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}

/* ---------- 使用說明 & 教學 ---------- */
function exampleRow(){const d=isNowMonth()?NOW.getDate():1;return document.querySelector(`[data-row="${d}"]`)||document.querySelector('[data-row]')}
const exampleCell=()=>{const r=exampleRow();return r&&r.querySelector('[data-p="p3"]')};
const T={
  today:{el:()=>$('todaycard'),title:'今天上什麼班',text:'最上面這張黃色的卡片，會寫今天和明天上什麼班。打開就能看到。'},
  month:{el:()=>$('monthnav'),title:'換月份',text:'按左右兩邊的箭頭，可以看上個月或下個月。打開時會自動顯示這個月。'},
  total:{el:()=>$('totalBtn'),title:'這個月上幾天',text:'這裡寫這個月一共上幾天班。點一下可以看每一種班各幾天。'},
  row:{el:exampleRow,title:'一天一行',text:'每一行是一天。有顏色的格子是上班，寫 A、B、C、D；寫「休」的是休息。今天那一行會用黃色框起來。'},
  names:{el:()=>$('head'),title:'誰的班',text:'最上面這一排是名字。左邊三個人是第一處，右邊三個人是第二處。往下滑的時候，名字會一直留在上面。'},
  lock:{el:()=>$('lockBtn'),title:'先按「開始修改」',text:'平常是鎖住的，不會不小心改到。要改的時候，先按這個「開始修改」。'},
  cell:{el:exampleCell,title:'點格子改班',text:'開始修改之後，點想改的格子，下面會跳出 A、B、C、D 和「休息」，選一個就改好了。'},
  done:{el:()=>$('fab'),show:'fab',title:'改完記得鎖定',text:'修改的時候，右下角會出現一顆「完成，鎖定」按鈕。改完按它，就會鎖住並儲存，不用滑回最上面。'},
  undo:{el:exampleCell,title:'改錯了沒關係',text:'每次改完，畫面上方會出現一行字，旁邊有「復原」按鈕。按一下，就會回到改之前的樣子。'},
  toTop:{el:()=>$('topBtn'),show:'topBtn',title:'回到最上面',text:'往下滑到比較下面的時候，右下角會出現「回到最上面」按鈕。按一下就會回到最上面。'},
  times:{el:()=>$('legend'),title:'班別時間',text:'這張卡片寫 A、B、C、D 每一種班是幾點到幾點。點一下就可以設定時間。'},
  times2:{title:'選時間',text:'點時間的格子，會跳出選時間的畫面，選好幾點幾分再按「設定」。四種班都選好後，按「儲存」就完成了。夜班跨到隔天也沒關係，會自動寫「到隔天」。'},
  installLater:{el:()=>$('helpBtn'),title:'之後想放到桌面',text:'好的。之後想把班表放到手機桌面，按「使用說明」，找「怎麼放到手機桌面？」就可以了。'},
  nextMonth:{el:()=>$('next'),title:'到新的月份',text:'先按右邊的箭頭，換到要排班的月份。'},
  copy:{title:'照上個月複製',text:'新的月份如果還是空的，畫面會出現「照上個月複製」按鈕。先按「開始修改」，再按這顆，就會把上個月的排法帶過來，再挑要改的格子修改就好。'},
  rename:{el:()=>$('head').querySelector('[data-rename]'),title:'點名字改名字',text:'開始修改之後，點最上面的名字，就可以改成正確的字，按「儲存」就好。'},
  font:{el:()=>$('fontBtn'),title:'字太小？',text:'按「放大字體」，整個畫面的字和格子都會變大。再按一次就變回來。'},
  help:{el:()=>$('helpBtn'),title:'忘記怎麼用',text:'按「使用說明」，可以找到每個功能怎麼用，也能再看一次這個教學。想把班表放到手機桌面，也在裡面。'},
  inst1:{title:'用 Chrome 打開班表',text:'先用手機上的 Chrome 瀏覽器打開班表的網址。'},
  inst2:{title:'點右上角三個點',text:'點 Chrome 右上角的「⋮」（直的三個點）。'},
  inst3:{title:'選「加到主畫面」',text:'在選單裡點「加到主畫面」。有的手機會寫「安裝應用程式」，點它也可以。'},
  inst4:{title:'按「安裝」',text:'跳出視窗後按「安裝」或「新增」。回到手機桌面，就會看到藍色的「班表」圖示，以後點它就能打開。'},
};
const MAIN_TOUR=[{title:'歡迎使用班表',text:'這是洪國昌的班表。接下來用幾個步驟，帶您看怎麼使用。'},T.today,T.month,T.total,T.times,T.row,T.lock,T.cell,T.done,T.toTop,T.font,T.help];
const HELP=[
  {icon:'sun',q:'今天上什麼班？',a:'<p>打開畫面，最上面黃色的卡片就會寫今天和明天上什麼班。下面表格裡，今天那一行也會用黃色框起來。</p>',tour:[T.today,T.row]},
  {icon:'calendar',q:'怎麼看其他月份？',a:'<p>按月份兩邊的箭頭換月份。看別的月份時，會出現「回到這個月」按鈕，按一下就回來。</p>',tour:[T.month]},
  {icon:'chart',q:'這個月上幾天班？',a:'<p>月份下面寫著一共上幾天班。點一下，可以看第一處、第二處各種班上幾天。</p>',tour:[T.total]},
  {icon:'clock',q:'怎麼設定各班的時間？',a:'<p>點表格上方的「班別時間」卡片，在每一種班旁邊選開始和結束的時間，按「儲存」。設好之後，今天卡片和選班的時候都會顯示時間。</p>',tour:[T.times,T.times2]},
  {icon:'grid',q:'表格怎麼看？',a:'<p>一天一行。上面一排是名字，左邊三人是第一處，右邊三人是第二處。有顏色、寫 A、B、C、D 的是上班，寫「休」的是休息。</p>',tour:[T.names,T.row]},
  {icon:'pen',q:'怎麼修改班表？',a:'<p>先按左上角「開始修改」，再點想改的格子，選 A、B、C、D 或「休息」。改完按右下角「完成，鎖定」。</p>',tour:[T.lock,T.cell,T.done]},
  {icon:'undo',q:'改錯了怎麼辦？',a:'<p>改完後，畫面上方會出現「復原」按鈕，按一下就會回到改之前的樣子。</p>',tour:[T.undo]},
  {icon:'copy',q:'新的月份怎麼排班？',a:'<p>換到新的月份，按「開始修改」，再按「照上個月複製」，把上個月的排法帶過來，再挑要改的格子修改。</p>',tour:[T.nextMonth,T.lock,T.copy]},
  {icon:'user',q:'名字寫錯了怎麼改？',a:'<p>按「開始修改」後，點最上面的名字，改好按「儲存」。</p>',tour:[T.lock,T.rename]},
  {icon:'arrowUpCircle',q:'滑太下面，怎麼回到上面？',a:'<p>往下滑之後，右下角會出現「回到最上面」按鈕，按一下就回到最上面。</p>',tour:[T.toTop]},
  {icon:'textUp',q:'字太小看不清楚',a:'<p>按上面的「放大字體」，字和格子都會變大。再按一次「縮小字體」就變回來。</p>',tour:[T.font]},
  {id:'install',icon:'phone',q:'怎麼放到手機桌面？',a:'<p>放到桌面以後，就像 App 一樣，點圖示就能打開。</p><ol><li>用 Chrome 打開班表網址</li><li>點右上角 <span class="kbd">⋮</span></li><li>點「加到主畫面」或「安裝應用程式」</li><li>按「安裝」，桌面就會出現「班表」圖示</li></ol><p>放到桌面後，裡面的班表跟用 Chrome 打開看到的是同一份，改了兩邊都一樣。</p>',tour:[T.inst1,T.inst2,T.inst3,T.inst4],installBtn:true},
];
function showHelp(open){
  let h=`<div class="sheet-head"><h2>${ic('help')}使用說明</h2><button class="closex" data-close>${ic('x')}關閉</button></div>
    <button class="big" data-main>${ic('play')}從頭看一次使用教學</button>
    <div class="acc">`;
  HELP.forEach((it,i)=>{
    const o=i===open;
    const inst=it.installBtn&&installPrompt&&!isStandalone()?`<button class="big" data-install>${ic('phone')}直接放到桌面</button>`:'';
    h+=`<div class="acc-item"><button class="acc-q" aria-expanded="${o}" data-acc="${i}"><span class="qi">${ic(it.icon)}</span><span class="qt">${it.q}</span>${ic('chevD','chev')}</button>
      <div class="acc-a" ${o?'':'hidden'}>${it.a}${inst}<button class="big soft" data-tour="${i}">${ic('play')}看不懂？一步一步教我</button></div></div>`;
  });
  h+='</div>';
  openSheet(h,e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-close'))return closeSheet();
    if(b.hasAttribute('data-main'))return startTour(MAIN_TOUR,true);
    if(b.hasAttribute('data-install')){closeSheet();return doInstall()}
    if(b.dataset.tour!=null)return startTour(HELP[+b.dataset.tour].tour,false);
    if(b.dataset.acc!=null){
      const opened=b.getAttribute('aria-expanded')==='true';
      $('sheet').querySelectorAll('.acc-q').forEach(q=>{q.setAttribute('aria-expanded','false');q.nextElementSibling.hidden=true});
      if(!opened){b.setAttribute('aria-expanded','true');b.nextElementSibling.hidden=false;b.scrollIntoView({block:'nearest'})}
    }
  });
  if(open>=0)requestAnimationFrame(()=>{const q=$('sheet').querySelector(`[data-acc="${open}"]`);q&&q.scrollIntoView({block:'start'})});
}
$('helpBtn').onclick=()=>showHelp(-1);

let tour=null,tourEl=null,tourShown=null;
function restoreShown(){if(tourShown){const e=tourShown;tourShown=null;if(e.id==='fab')e.hidden=!editing;else updateTopBtn()}}
function startTour(steps,main){closeSheet();$('toast').hidden=true;tour={steps,main,i:0};showStep()}
function endTour(){restoreShown();if(tour&&tour.main)ls.set(TOUR_KEY,'1');tour=null;tourEl=null;$('tourblock').hidden=true;$('ring').hidden=true;$('tourcard').hidden=true}
function visible(el){if(!el)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0}
function showStep(){
  const s=tour.steps[tour.i],n=tour.steps.length,last=tour.i===n-1;
  restoreShown();
  if(s.show){const e=$(s.show);if(e){e.hidden=false;tourShown=e}}
  tourEl=s.el?s.el():null;if(!visible(tourEl))tourEl=null;
  $('tourblock').hidden=false;$('tourcard').hidden=false;
  $('tourblock').classList.toggle('dim',!tourEl);
  $('tourcard').innerHTML=`<div class="step"><span>${n>1?`第 ${tour.i+1} 步，共 ${n} 步`:'操作教學'}</span>${last?'':'<button class="skip" data-skip>跳過教學</button>'}</div>
    <h2>${s.title}</h2><p>${s.text}</p>
    <div class="row2">${tour.i>0?`<button class="big ghost" data-prev>${ic('chevL')}上一步</button>`:'<span></span>'}<button class="big" data-next>${last?ic('check')+(tour.main?'我會用了':'知道了'):'下一步'+ic('chevR')}</button></div>`;
  if(tourEl){
    if(!tourEl.closest('.head')&&!tourEl.closest('.days')&&!tourEl.closest('.fabs'))scrollTo(0,0);
    tourEl.scrollIntoView({block:'center'});
    requestAnimationFrame(()=>requestAnimationFrame(placeRing));
  }else{$('ring').hidden=true;$('tourcard').className='tourcard bottom'}
}
function placeRing(){
  if(!tour||!tourEl){$('ring').hidden=true;return}
  const r=tourEl.getBoundingClientRect(),p=8,ring=$('ring');
  ring.hidden=false;
  ring.style.left=(r.left-p)+'px';ring.style.top=(r.top-p)+'px';ring.style.width=(r.width+p*2)+'px';ring.style.height=(r.height+p*2)+'px';
  $('tourcard').className='tourcard '+((r.top+r.height/2)>innerHeight*0.5?'top':'bottom');
}
$('tourcard').addEventListener('click',e=>{
  if(!tour)return;
  if(e.target.closest('[data-skip]'))return endTour();
  if(e.target.closest('[data-prev]')){tour.i--;return showStep()}
  if(e.target.closest('[data-next]')){if(tour.i>=tour.steps.length-1)return endTour();tour.i++;showStep()}
});
addEventListener('scroll',()=>{if(tour)placeRing()},{passive:true});
addEventListener('resize',()=>{if(tour)placeRing()});

/* ---------- 跟著日期走 ---------- */
let lastDay=NOW.toDateString();
function syncToday(){
  const n=getNow();
  if(n.toDateString()!==lastDay){lastDay=n.toDateString();NOW=n;Y=n.getFullYear();M=n.getMonth()+1}
  render();if(tour)placeRing();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncToday()});
addEventListener('hashchange',()=>{lastDay='';syncToday()});

/* ---------- 啟動 ---------- */
setEditing(false);setFont(bigText);render();updateInstallCard();updateTopBtn();
const shown=Date.now();
Promise.race([document.fonts?document.fonts.ready:Promise.resolve(),new Promise(r=>setTimeout(r,1500))]).then(()=>{
  setTimeout(()=>{
    $('splash').classList.add('hide');setTimeout(()=>{$('splash').hidden=true},400);
    if(!ls.get(TOUR_KEY))setTimeout(()=>startTour(MAIN_TOUR,true),450);
  },Math.max(0,600-(Date.now()-shown)));
});
</script>
